[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transCSSR"
version = "1.1.0"
description = "Token-first Causal State Splitting Reconstruction (CSSR) for epsilon-machines and epsilon-transducers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "David Darmon", email = "ddarmon@monmouth.edu" },
]
keywords = [
    "CSSR",
    "causal states",
    "epsilon-machine",
    "epsilon-transducer",
    "computational mechanics",
    "tokens",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# Runtime dependencies of the token-first ``transcssr`` package only.
dependencies = [
    "numpy",
    "scipy",
]

[project.optional-dependencies]
# Extra dependencies required only by the legacy flat modules
# (``transCSSR.py`` / ``filter_data_methods.py``) and the demo scripts.
legacy = [
    "python-igraph",
    "pandas",
    "matplotlib",
    "joblib",
    "tqdm",
]

[project.urls]
Homepage = "https://github.com/ddarmon/transCSSR"
Repository = "https://github.com/ddarmon/transCSSR"

[tool.setuptools]
# The token-first package plus the two legacy top-level modules, kept
# importable for existing users (see MIGRATION.md).
packages = ["transcssr"]
py-modules = ["transCSSR", "filter_data_methods"]
